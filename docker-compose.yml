services:
  # Python MCP Server - Main application with SUPERIOR AI-crushing capabilities
  mcp-server:
    build:
      context: .
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE:-2025-01-09}
        VCS_REF: ${VCS_REF:-latest}
        VERSION: ${VERSION:-1.1.0}
    container_name: python-mcp-server-ultimate
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      - ENVIRONMENT=production
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8080
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-4}
      - DEVELOPMENT_MODE=false
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Persistent storage for logs and data
      - mcp_logs:/app/logs
      - mcp_data:/app/data
      - mcp_cache:/app/cache
      # Documentation storage for our comprehensive Python knowledge base
      - python_docs:/app/docs/python_manuals
    networks:
      - mcp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    # Security settings
    security_opt:
      - no-new-privileges:true
    read_only: false  # Some operations require write access
    tmpfs:
      - /tmp:size=100M,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # Redis - Distributed caching for UNLIMITED performance
  redis:
    image: redis:7-alpine
    container_name: mcp-redis-cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --timeout 300
      --tcp-keepalive 60
    volumes:
      - redis_data:/data
    networks:
      - mcp_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
        reservations:
          memory: 128M
          cpus: '0.1'
    # Security settings
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=50M,mode=1777

networks:
  mcp_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  # Application data volumes
  mcp_logs:
    driver: local
  mcp_data:
    driver: local
  mcp_cache:
    driver: local
  python_docs:
    driver: local
    
  # Redis data
  redis_data:
    driver: local