# GHCR image pull secret template
#
# Preferred: create the secret locally with kubectl using your GitHub username and a
# Personal Access Token (PAT) that has `read:packages` scope. Example commands are
# shown in the repository README and below.
#
# If you prefer to apply a manifest instead of using `kubectl create secret`,
# you can generate a dockerconfigjson and paste the base64-encoded value below.
# Replace the placeholder value for `.dockerconfigjson` with a valid base64-encoded
# JSON from your docker config (see command examples below).

apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: python-mcp-server
type: kubernetes.io/dockerconfigjson
data:
  # Replace this value with a base64-encoded dockerconfigjson if you are applying
  # the manifest directly. Example (do not run in this file):
  # echo -n '{"auths":{"ghcr.io":{"username":"YOUR_USERNAME","password":"YOUR_PAT","auth":"BASE64(username:pat)"}}}' | base64 -w0
  .dockerconfigjson: REPLACE_WITH_BASE64_DOCKERCONFIGJSON

# --- Helpful commands (run locally) ---
# 1) Create the secret using kubectl and your PAT (recommended):
#
# export GHCR_USER="<your-github-username>"
# export GHCR_PAT="<your-personal-access-token-with-read:packages-scope>"
# kubectl create secret docker-registry ghcr-pull-secret \
#   --docker-server=ghcr.io \
#   --docker-username="$GHCR_USER" \
#   --docker-password="$GHCR_PAT" \
#   --docker-email="you@example.com" \
#   -n python-mcp-server
#
# 2) Verify the secret exists in the target namespace:
# kubectl get secret ghcr-pull-secret -n python-mcp-server -o yaml
#
# 3) Re-deploy (uses repo wrapper, skips local build):
# SKIP_LOCAL_BUILD=1 ./.vscode/approved-commands.sh deploy
#
# 4) Check pods and logs:
# kubectl get pods -n python-mcp-server
# kubectl logs -l app.kubernetes.io/name=python-mcp-server -n python-mcp-server --tail=200
#
# 5) Quick health check via port-forward:
# kubectl port-forward svc/mcp-server-service 3030:3030 -n python-mcp-server &
# curl -sS -f http://localhost:3030/health
