apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server
  namespace: python-mcp-server
  labels:
    app.kubernetes.io/name: python-mcp-server
    app.kubernetes.io/component: serviceaccount
    app.kubernetes.io/part-of: mcp-platform
  annotations:
    description: "Service account for Python MCP Server"
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-role
  labels:
    app.kubernetes.io/name: python-mcp-server
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: mcp-platform
rules:
# Core API groups
- apiGroups: [""]
  resources: 
  - pods
  - pods/log
  - pods/status
  - services
  - endpoints
  - nodes
  - namespaces
  - events
  - configmaps
  - secrets
  verbs: ["get", "list", "watch"]
  
# Apps API group
- apiGroups: ["apps"]
  resources:
  - deployments
  - daemonsets
  - statefulsets
  - replicasets
  verbs: ["get", "list", "watch"]
  
# Extensions and networking
- apiGroups: ["extensions", "networking.k8s.io"]
  resources:
  - ingresses
  - networkpolicies
  verbs: ["get", "list", "watch"]
  
# Metrics and monitoring
- apiGroups: ["metrics.k8s.io"]
  resources:
  - nodes
  - pods
  verbs: ["get", "list"]
  
# Custom resources (if needed)
- apiGroups: ["apiextensions.k8s.io"]
  resources:
  - customresourcedefinitions
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-binding
  labels:
    app.kubernetes.io/name: python-mcp-server
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: mcp-platform
subjects:
- kind: ServiceAccount
  name: mcp-server
  namespace: python-mcp-server
roleRef:
  kind: ClusterRole
  name: mcp-server-role
  apiGroup: rbac.authorization.k8s.io
