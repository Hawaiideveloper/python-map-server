apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-config
  namespace: python-mcp-server
  labels:
    app.kubernetes.io/name: python-mcp-server
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: mcp-platform
data:
  # Server Configuration
  ENVIRONMENT: "production"
  PORT: "3030"
  HOST: "0.0.0.0"
  
  # Logging Configuration
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  
  # Security Configuration
  ENABLE_AUTH: "true"
  CORS_ENABLED: "true"
  CORS_ORIGINS: "*"
  
  # Performance Configuration
  WORKERS: "1"
  TIMEOUT: "30"
  KEEPALIVE: "2"
  
  # Feature Flags
  ENABLE_METRICS: "true"
  ENABLE_HEALTH_CHECKS: "true"
  ENABLE_ADMIN_DASHBOARD: "true"
