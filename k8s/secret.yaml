apiVersion: v1
kind: Secret
metadata:
  name: mcp-server-secrets
  namespace: python-mcp-server
  labels:
    app.kubernetes.io/name: python-mcp-server
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: mcp-platform
type: Opaque
data:
  # Base64 encoded secrets - replace with your actual secrets
  # To encode: echo -n 'your-secret' | base64
  API_KEY: bXktc2VjcmV0LWFwaS1rZXk=  # my-secret-api-key
  JWT_SECRET: bXktand0LXNlY3JldA==     # my-jwt-secret
  DB_PASSWORD: bXktZGItcGFzc3dvcmQ=   # my-db-password
