apiVersion: v1
kind: Service
metadata:
  name: mcp-server-service
  namespace: python-mcp-server
  labels:
    app.kubernetes.io/name: python-mcp-server
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: mcp-platform
  annotations:
    description: "Service for Python MCP Server"
    prometheus.io/scrape: "true"
    prometheus.io/port: "3030"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: python-mcp-server
    app.kubernetes.io/instance: mcp-server-prod
  ports:
    - name: http
      port: 3011
      targetPort: 3030
      protocol: TCP
      nodePort: 30011
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
      nodePort: 30080
  sessionAffinity: None

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-headless
  namespace: python-mcp-server
  labels:
    app.kubernetes.io/name: python-mcp-server
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: mcp-platform
    service-type: headless
  annotations:
    description: "Headless service for Python MCP Server"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: python-mcp-server
    app.kubernetes.io/instance: mcp-server-prod
  ports:
    - name: http
      port: 3030
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
