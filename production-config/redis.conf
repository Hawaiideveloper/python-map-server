# Redis production configuration for Python MCP Server
# Optimized for distributed caching and rate limiting

# Network and Security
bind 127.0.0.1
port 6379
timeout 300
tcp-keepalive 60
tcp-backlog 511

# Security
protected-mode yes
# requirepass your_redis_password_here  # Uncomment and set password for production

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Snapshots
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# Logging
loglevel notice
# logfile /var/log/redis/redis-server.log  # Uncomment for file logging
syslog-enabled no

# Client Management
maxclients 10000

# Performance Tuning
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Pub/Sub
notify-keyspace-events ""

# Advanced Configuration
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command SHUTDOWN SHUTDOWN_MCP_SERVER
rename-command EVAL ""
