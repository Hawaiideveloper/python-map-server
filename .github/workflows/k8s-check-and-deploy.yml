name: k8s checklist and optional deploy

on:
  push:
    paths:
      - 'k8s/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run k8s checklist tests
        run: python -m pytest tests/test_k8s_deployment_checklist.py -q

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 --decode > $GITHUB_WORKSPACE/kubeconfig
          mkdir -p $HOME/.kube
          mv $GITHUB_WORKSPACE/kubeconfig $HOME/.kube/config
      - name: Deploy to cluster
        run: |
          chmod +x k8s/deploy.sh
          ./k8s/deploy.sh
        env:
          KUBECONFIG: $HOME/.kube/config