name: Publish Docker Image to GHCR

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'src/**'
      - '.github/workflows/ghcr-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/hawaiideveloper/python-mcp-server

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run tests
        run: poetry run pytest -q

      - name: Derive version & tags
        id: meta
        run: |
          VERSION=$(grep '^version =' pyproject.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          SHORT_SHA=${GITHUB_SHA::12}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Using version $VERSION and short sha $SHORT_SHA"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output summary
        run: |
          echo "Published image tags:" >> $GITHUB_STEP_SUMMARY
          echo "- $IMAGE_NAME:latest" >> $GITHUB_STEP_SUMMARY
          echo "- $IMAGE_NAME:${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- $IMAGE_NAME:${{ steps.meta.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
