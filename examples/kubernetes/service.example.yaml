apiVersion: v1
kind: Service
metadata:
  name: python-mcp-server-service
  namespace: python-mcp-server
  labels:
    app: python-mcp-server
spec:
  type: LoadBalancer  # Change to NodePort or ClusterIP as needed
  ports:
  - name: http
    port: 80
    targetPort: 33221
    # nodePort: 32556  # Uncomment for NodePort
  selector:
    app: python-mcp-server
