apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-mcp-server
  namespace: python-mcp-server
  labels:
    app: python-mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-mcp-server
  template:
    metadata:
      labels:
        app: python-mcp-server
    spec:
      containers:
      - name: python-mcp-server
        image: ghcr.io/YOUR_USERNAME/python-mcp-server:latest
        ports:
        - containerPort: 33221
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "33221"
        # Add your environment variables here
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 33221
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 33221
          initialDelaySeconds: 5
          periodSeconds: 5
