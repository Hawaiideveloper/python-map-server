[tool.poetry]
name = "python-mcp-server"
version = "0.1.0"
description = "A Python MCP server with Python execution, linting, testing, docs, and cloud SDK integrations"
authors = ["AI MCP Server Generator <aicp@example.com>"]
packages = [{include = "mcp_server"}]

[tool.poetry.dependencies]
python = "^3.12"
mcp-python = "^0.3.0"
ruff = "^0.0.280"
black = "^23.3.0"
pytest = "^7.4.0"
bandit = "^1.7.5"
boto3 = "^1.26.0"
google-cloud-storage = "^2.7.0"
azure-storage-blob = "^12.15.0"
fastapi = "^0.95.0"
uvicorn = "^0.22.0"
# Enhanced security and monitoring
psutil = "^5.9.0"
cryptography = "^41.0.0"
# Database support
sqlalchemy = "^2.0.0"
alembic = "^1.11.0"
# Documentation
sphinx = "^7.1.0"
mkdocs = "^1.5.0"
mkdocs-material = "^9.1.0"

[tool.poetry.group.dev.dependencies]
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
httpx = "^0.24.0"
# Optional production databases (commented out)
# psycopg2-binary = "^2.9.0"  # PostgreSQL
# pymysql = "^1.1.0"  # MySQL

[tool.poetry.scripts]
mcp-server = "mcp_server.server:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Tool configurations
[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = ["S101", "S603", "S607"]  # Allow assert, subprocess usage

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]  # Allow asserts and magic values in tests

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "security: marks tests as security-related"
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
